# NEXUS — gate di rilascio.
#
# AUD0-TEST-002 / AUD0-TEST-003 / RP0-12: il repository non aveva alcuna
# workflow di CI, quindi nessuna modifica era verificata prima del merge e il
# deploy automatico su Render partiva da codice non testato.
#
# Questo workflow è il gate minimo richiesto dal Reviewer Pack:
#   1. test backend + contratti
#   2. build dell'immagine Docker e smoke test di import/avvio
#   3. build del frontend
#   4. controllo che nessun segreto di esempio sia presente nel codice
name: CI

on:
  push:
    branches: ["main", "claude/**", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests e contratti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r server/requirements-dev.txt

      - name: Validate canonical contracts
        run: python contracts/validate_registry.py

      - name: Run test suite
        working-directory: server
        env:
          NEXUS_ENV: DEVELOPMENT
        run: python -m pytest tests -v

  security-preflight:
    name: Preflight di sicurezza (fail-closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r server/requirements-dev.txt

      # Prova positiva: con i valori di default il backend NON deve avviarsi in
      # un ambiente hardened. Se questo step "riesce" ad avviare l'app, il
      # controllo fail-closed è regredito (NEXUS-SEC-001).
      - name: Le credenziali di default devono bloccare l'avvio LIVE
        working-directory: server
        env:
          NEXUS_ENV: LIVE
          NEXUS_BRIDGE_TOKEN: NEXUS_BRIDGE_TOKEN_2026
          NEXUS_ADMIN_USER: admin
          NEXUS_ADMIN_PASSWORD: admin
          NEXUS_LICENSE_MODE: open
          NEXUS_DB_PATH: /tmp/nexus-ci.db
        run: |
          python - <<'PY'
          import sys
          import nexus_security, app
          result = app.security_preflight()
          if result.ok:
              print("REGRESSIONE: il preflight ha accettato le credenziali di default")
              sys.exit(1)
          print("Preflight ha correttamente rifiutato la configurazione:")
          for failure in result.failures:
              print(f"  - {failure}")
          PY

      - name: Nessun segreto di esempio nel codice sorgente
        run: |
          # Il token di esempio può comparire solo in documentazione e nei
          # commenti che spiegano la remediazione, mai come valore attivo.
          if git grep -n "NEXUS_BRIDGE_TOKEN_2026" -- \
               ':!*.md' ':!.github/**' ':!server/nexus_security.py' \
               ':!LocalBridge/nexus_local_worker.py' ':!server/app.py'; then
            echo "::error::token di esempio ancora presente in codice attivo"
            exit 1
          fi
          echo "OK: nessun token di esempio in codice attivo"

  docker-smoke:
    name: Build immagine e smoke test di avvio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AUD0-DEP-006 / AUD0-DEPLOY-DOCKER-001: un'immagine pulita falliva
      # all'import perché il Dockerfile non copiava tutti i moduli. Questo job
      # impedisce che la regressione si ripresenti.
      - name: Build image
        run: docker build -f server/Dockerfile -t nexus-backend:ci .

      - name: Import smoke test
        run: |
          docker run --rm -e NEXUS_ENV=DEVELOPMENT -e NEXUS_DB_PATH=/tmp/ci.db \
            nexus-backend:ci python -c "import app; print('import OK', app.APP_VERSION)"

      - name: Il worker e il manifest devono essere nell'immagine
        run: |
          docker run --rm nexus-backend:ci sh -c \
            'test -f /app/protected/nexus_local_worker.py && \
             test -f /app/protected/deployment-manifest.json && \
             echo "artefatti presenti"'

      - name: Startup e readiness
        run: |
          docker run -d --name nexus-ci -p 8001:8001 \
            -e NEXUS_ENV=DEVELOPMENT -e NEXUS_DB_PATH=/data/ci.db \
            nexus-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/api/health >/dev/null 2>&1; then
              echo "liveness OK dopo ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/api/health | head -c 400; echo
          # /api/ready può restituire 503 in DEVELOPMENT (warning di config):
          # ci interessa che risponda e riporti i check, non che sia verde.
          curl -sS http://127.0.0.1:8001/api/ready | head -c 800; echo
          docker logs nexus-ci | tail -30
          docker rm -f nexus-ci

      - name: Il container non deve girare come root
        run: |
          uid=$(docker run --rm nexus-backend:ci id -u)
          if [ "$uid" = "0" ]; then
            echo "::error::il container gira come root (AUD0-DEP-008)"
            exit 1
          fi
          echo "OK: container in esecuzione con uid=$uid"

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # AUD0-FE-SUPPLY-001: molte dipendenze erano dichiarate "latest", quindi
      # due installazioni dello stesso commit potevano differire. Con le
      # versioni fissate `npm ci` richiede un lockfile coerente.
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: frontend
        env:
          CI: "false"   # i warning ESLint non devono bloccare la build CRA
        run: npm run build
