services:
  nexus-backend:
    build:
      # AUD0-DEPLOY-DOCKER-002: il context deve essere la root del repository,
      # altrimenti worker LocalBridge e deployment manifest restano fuori.
      context: .
      dockerfile: server/Dockerfile
    container_name: nexus-backend
    restart: unless-stopped
    ports:
      # AUD0-DEP-004 / AUD0-DEPLOY-COMPOSE-001: "8001:8001" pubblicava il
      # backend su ogni interfaccia dell'host. Per un'installazione locale il
      # default sicuro è il solo loopback; per esporlo, mettilo dietro un
      # reverse proxy con TLS.
      - "127.0.0.1:8001:8001"
    env_file:
      - ./server/.env
    environment:
      # Il compose serve installazioni locali: l'ambiente resta DEVELOPMENT.
      # Per un deployment reale imposta NEXUS_ENV=LIVE — il backend rifiuterà
      # di avviarsi finché credenziali e segreti sono quelli di esempio.
      NEXUS_ENV: ${NEXUS_ENV:-DEVELOPMENT}
      # NXS-DB-015: la persistenza dipendeva dal fatto che NEXUS_DB_PATH puntasse
      # davvero dentro il volume. Il Dockerfile lo imposta, ma un file .env che
      # lo sovrascrivesse riporterebbe il database dentro l'immagine — cioe' i
      # dati sparirebbero al primo redeploy, senza alcun errore. Qui il percorso
      # e' dichiarato esplicitamente e vince sul .env.
      NEXUS_DB_PATH: /data/nexus.db
    volumes:
      - nexus-data:/data
    # AUD0-DEP-005 / AUD0-DEPLOY-COMPOSE-002: senza healthcheck un processo
    # vivo ma inutilizzabile non veniva rilevato.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/api/ready', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  nexus-data:
